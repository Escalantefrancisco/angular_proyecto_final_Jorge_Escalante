
<mat-toolbar color="primary" class="barra-superior">

  <button
    mat-icon-button
    class="boton-menu"
    aria-label="Abrir o cerrar menú"
    (click)="menuAbierto = !menuAbierto">

    <mat-icon>menu</mat-icon>

  </button>

  <mat-icon class="logo">school</mat-icon>

  <span class="titulo">{{ titulo }}</span>

  <span class="espaciador"></span>

  <span class="subtitulo">Sistema universitario</span>

</mat-toolbar>

<mat-sidenav-container class="contenedor-principal">

  <!-- Menú lateral -->
  <mat-sidenav
    #sidenav
    mode="over"
    [opened]="menuAbierto"
    (closedStart)="cerrarMenu()"
    class="menu-lateral">

    <div class="encabezado-menu">
      <mat-icon>account_balance</mat-icon>
      <h3>Menú principal</h3>
    </div>

    <mat-nav-list>

      <a
        mat-list-item
        routerLink="/"
        routerLinkActive="activo"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="cerrarMenu()">

        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Inicio</span>

      </a>

      <a
        mat-list-item
        routerLink="/estudiantes"
        routerLinkActive="activo"
        (click)="cerrarMenu()">

        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle>Estudiantes</span>

      </a>

      <a
        mat-list-item
        routerLink="/inscripciones"
        routerLinkActive="activo"
        (click)="cerrarMenu()">

        <mat-icon matListItemIcon>assignment</mat-icon>
        <span matListItemTitle>Inscripciones</span>

      </a>

      <a
        mat-list-item
        routerLink="/respaldos"
        routerLinkActive="activo"
        (click)="cerrarMenu()">

        <mat-icon matListItemIcon>backup</mat-icon>
        <span matListItemTitle>Respaldos</span>

      </a>

    </mat-nav-list>

    <div class="pie-menu">
      <p>UniRegistro</p>
      <small>Angular 20 + Material</small>
    </div>

  </mat-sidenav>

  <!-- Contenido de cada página -->
  <mat-sidenav-content>

    <main class="contenido">
      <router-outlet></router-outlet>
    </main>

    <footer class="pie-pagina">
      UniRegistro - Sistema de gestión universitaria
    </footer>

  </mat-sidenav-content>

</mat-sidenav-container>
